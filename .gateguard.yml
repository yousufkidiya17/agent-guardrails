enabled: true
gates:
  read_before_edit: true
  fact_force_edit: false
  fact_force_write: false
  fact_force_bash_destructive: true
  fact_force_bash_routine: false
  bughunt_gate: false
  readonly_bash_bypass: true
audit:
  evidence_pass: false
  scope_pass: false
  trivial_pass: true
  high_risk_guard: true
ignore_paths:
  - ".venv/**"
  - "node_modules/**"
  - ".git/**"
